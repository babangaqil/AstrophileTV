<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  min-height:100vh;
  padding:0 34px 6px 0;
  overflow:hidden;
}
.badge{
  display:flex;align-items:center;justify-content:center;gap:5px;
  animation:fadeIn 0.3s ease forwards;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.icon{font-size:11px;line-height:1;}
.status{
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:700;
  letter-spacing:1px;line-height:1;
}
.status.sudah{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.80);}
.status.belum{color:#ff2d6e;text-shadow:0 0 8px rgba(255,45,110,0.80);}
</style>
</head>
<body>
<div class="badge" id="badge">
  <span class="icon" id="icon">✅</span>
  <span class="status sudah" id="status">SUDAH BAYAR</span>
</div>
<script>
function getParam(name){
  var url=window.location.href,idx=url.indexOf('?');
  if(idx<0)return null;
  var params=url.slice(idx+1).split('&');
  for(var i=0;i<params.length;i++){var p=params[i].split('=');if(decodeURIComponent(p[0])===name)return decodeURIComponent(p[1]||'')}
  return null
}
function updateStatus(s){
  var el=document.getElementById('status');
  var ic=document.getElementById('icon');
  if(s==='sudah'){
    el.className='status sudah';el.textContent='SUDAH BAYAR';ic.textContent='✅';
  } else {
    el.className='status belum';el.textContent='BELUM BAYAR';ic.textContent='❌';
  }
}
updateStatus(getParam('bayarStatus')||'belum');
</script>
</body>
</html>
