<!DOCTYPE html>
<html lang="id">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:transparent;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  min-height:100vh;
  padding:0 34px 6px 0;
  overflow:hidden;
}
.badge{
  display:flex;align-items:center;justify-content:center;gap:5px;
  animation:fadeIn 0.3s ease forwards;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.icon{font-size:11px;line-height:1;}
.status{
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:700;
  letter-spacing:1px;line-height:1;
}
.status.sudah{color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.80);}
.status.belum{color:#ff2d6e;text-shadow:0 0 8px rgba(255,45,110,0.80);}
</style>
</head>
<body>
<div class="badge" id="badge">
  <span class="icon" id="icon">✅</span>
  <span class="status sudah" id="status">SUDAH BAYAR</span>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
function getParam(name){
  var url=window.location.href,idx=url.indexOf('?');
  if(idx<0)return null;
  var params=url.slice(idx+1).split('&');
  for(var i=0;i<params.length;i++){var p=params[i].split('=');if(decodeURIComponent(p[0])===name)return decodeURIComponent(p[1]||'')}
  return null
}

function updateStatus(s){
  var el=document.getElementById('status');
  var ic=document.getElementById('icon');
  if(s==='sudah'){
    el.className='status sudah';el.textContent='SUDAH BAYAR';ic.textContent='✅';
  } else {
    el.className='status belum';el.textContent='BELUM BAYAR';ic.textContent='❌';
  }
}

// Tampilkan status awal dari URL param
updateStatus(getParam('bayarStatus')||'belum');

// Dipanggil dari Java (OverlayService) setelah page load
// untuk inject Firebase config dan mulai listener realtime
function initFirebaseSync(apiKey, dbUrl, projectId, tvNum, initStatus){
  try {
    if(!apiKey || !dbUrl) return;

    // Init Firebase jika belum
    var app;
    try {
      app = firebase.app('bayar_overlay');
    } catch(e) {
      app = firebase.initializeApp({
        apiKey: apiKey,
        databaseURL: dbUrl,
        projectId: projectId,
        appId: '1:789474619442:android:5f678d3b6ebdc99a1c8c2b'
      }, 'bayar_overlay');
    }

    var db = firebase.database(app);
    var ref = db.ref('settings/activeSessions/' + tvNum + '/bayarStatus');

    // Set status awal
    updateStatus(initStatus || 'belum');

    // Listener realtime — langsung update badge saat kasir ubah status
    ref.on('value', function(snap){
      var status = (snap.exists() && snap.val()) ? snap.val() : 'belum';
      updateStatus(status);
    });

  } catch(err) {
    console.error('initFirebaseSync error:', err);
  }
}
</script>
</body>
</html>
