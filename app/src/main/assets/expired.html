<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 100% LOKAL: tanpa internet, tanpa Google Fonts.
     Opsional: taruh file font di assets/fonts/ (Orbitron-Black.ttf, Rajdhani-Bold.ttf)
     kalau mau font khusus. Kalau file tidak ada, otomatis pakai font bawaan TV. -->
<style>
@font-face{font-family:'Orbitron';font-weight:900;font-display:swap;src:url('fonts/Orbitron-Black.ttf')}
@font-face{font-family:'Rajdhani';font-weight:600;font-display:swap;src:url('fonts/Rajdhani-Bold.ttf')}

*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#000;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}

/* Font stack: font khusus (kalau ada) -> font bawaan Android */
.f-head{font-family:'Orbitron','sans-serif-black','Roboto',sans-serif}
.f-body{font-family:'Rajdhani','sans-serif-condensed','Roboto',sans-serif}

.frame{
  width:100%;max-width:920px;aspect-ratio:16/9;
  position:relative;overflow:hidden;border-radius:8px;background:#000;
  box-shadow:0 0 0 1px rgba(255,0,20,0.12);
}

/* Semua layer di bawah ini STATIS atau hanya animasi opacity/transform
   (dikerjakan GPU, tidak repaint) supaya ringan di TV box spek rendah. */
.bg-radial{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 70% at 50% 50%,rgba(100,0,8,0.20) 0%,transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%,transparent 28%,rgba(0,0,0,0.85) 100%);
  will-change:opacity;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}

.scan{position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.09) 2px,rgba(0,0,0,0.09) 3px)}

.fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* Garis atas: geser pakai transform (bukan background-position) */
.sweep-wrap{position:absolute;top:0;left:0;right:0;height:2px;z-index:8;overflow:hidden}
.sweep{position:absolute;top:0;left:-100%;width:200%;height:100%;
  background:linear-gradient(90deg,transparent 5%,#ff0020 28%,#ff6040 50%,#ff0020 72%,transparent 95%);
  will-change:transform;animation:sw 4s linear infinite}
@keyframes sw{0%{transform:translateX(0)}100%{transform:translateX(50%)}}

.sweep-bot{position:absolute;bottom:0;left:0;right:0;height:1.5px;z-index:8;
  background:linear-gradient(90deg,transparent 10%,rgba(255,0,20,.4) 50%,transparent 90%)}

/* Nama toko — statis */
.store{position:absolute;top:clamp(16px,3%,30px);left:0;right:0;text-align:center;z-index:10}
.store-name{
  font-size:clamp(17px,3vw,36px);font-weight:900;
  letter-spacing:clamp(6px,1.5vw,18px);text-transform:uppercase;
  color:#ff4050;
  text-shadow:0 0 14px rgba(255,0,20,.7),0 0 30px rgba(255,0,20,.3);
}
.store-line{width:clamp(50px,10%,100px);height:1.5px;margin:clamp(6px,1%,10px) auto 0;
  background:linear-gradient(90deg,transparent,rgba(255,0,20,.55),transparent)}

.content{
  position:absolute;
  top:clamp(60px,18%,110px);bottom:clamp(30px,7%,55px);
  left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  gap:clamp(16px,3%,48px);
  padding:0 clamp(20px,4%,50px);
  z-index:7;
}

.lock-col{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2%,12px);flex-shrink:0}
/* Glow statis di belakang ikon; ikon hanya animasi transform */
.lock-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.lock-wrap::before{content:"";position:absolute;width:150%;height:150%;
  background:radial-gradient(circle,rgba(255,0,20,.45) 0%,transparent 65%)}
.lock-icon{position:relative;font-size:clamp(44px,9vw,110px);
  will-change:transform;animation:holoFloat 3s ease-in-out infinite}
@keyframes holoFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.05)}
}
.lock-label{font-size:clamp(6px,.75vw,9px);font-weight:700;color:rgba(255,60,60,.45);letter-spacing:2px}

.vdiv{width:1px;height:clamp(50px,14%,100px);
  background:linear-gradient(to bottom,transparent,rgba(255,0,20,.25),transparent);
  flex-shrink:0}

.info-col{display:flex;flex-direction:column;gap:clamp(3px,.5%,6px)}
.label{
  font-size:clamp(20px,4vw,52px);font-weight:900;
  color:#ff0020;letter-spacing:clamp(2px,.6vw,8px);
  text-shadow:0 0 20px rgba(255,0,20,1),0 0 55px rgba(200,0,20,.5);
  will-change:transform;animation:gl 5s steps(1) infinite;
}
/* Glitch hanya transform (tanpa filter) */
@keyframes gl{
  0%,87%,100%{transform:none}
  88%{transform:translate(-2px,0) skewX(-3deg)}
  89%{transform:translate(2px,0)}
  90%{transform:none}
}
.sub{font-size:clamp(8px,.9vw,12px);font-weight:600;color:rgba(255,80,80,.45);letter-spacing:4px}
.h-line{width:100%;height:1.5px;
  background:linear-gradient(90deg,rgba(255,0,20,.35),transparent);
  margin:clamp(8px,1.5%,14px) 0}
.name{font-size:clamp(14px,2.8vw,36px);font-weight:900;color:#fff;letter-spacing:3px}
.tvrow{font-size:clamp(8px,1vw,12px);font-weight:600;color:rgba(255,80,80,.45);letter-spacing:4px}
.hub{font-size:clamp(8px,.9vw,11px);color:rgba(255,60,60,.40);
  letter-spacing:2px;margin-top:clamp(6px,1.2%,12px);font-weight:600;
  will-change:opacity;animation:fi 3s ease-in-out infinite}
@keyframes fi{0%,100%{opacity:.38}50%{opacity:.80}}
</style>
</head>
<body>
<div class="frame">
  <div class="bg-radial"></div>
  <div class="scan"></div>

  <!-- Satu canvas ringan: partikel + meteor -->
  <canvas id="fx" class="fx"></canvas>

  <div class="sweep-wrap"><div class="sweep"></div></div>
  <div class="sweep-bot"></div>

  <div class="store">
    <div class="store-name f-head" id="storeName">ASTROPHILE</div>
    <div class="store-line"></div>
  </div>

  <div class="content">
    <div class="lock-col">
      <div class="lock-wrap"><div class="lock-icon">🔒</div></div>
      <div class="lock-label f-head">AKSES DIBLOKIR</div>
    </div>
    <div class="vdiv"></div>
    <div class="info-col">
      <div class="label f-head">WAKTU HABIS</div>
      <div class="sub f-body">SESSION BERAKHIR</div>
      <div class="h-line"></div>
      <div class="name f-head">BUDI SANTOSO</div>
      <div class="tvrow f-body">TV 1 &nbsp;·&nbsp; PS4</div>
      <div class="hub f-body">⚡ Hubungi operator</div>
    </div>
  </div>
</div>

<script>
// Efek ringan: 14 partikel + meteor. Tanpa shadowBlur, tanpa garis antar-partikel,
// dibatasi ~30 FPS supaya CPU/GPU TV box tidak kewalahan.
;(function(){
  var c=document.getElementById('fx'); if(!c) return;
  var ctx=c.getContext('2d');
  var W=0,H=0;
  function resize(){
    var r=c.parentElement.getBoundingClientRect();
    W=c.width=Math.round(r.width)||400;
    H=c.height=Math.round(r.height)||225;
  }
  resize(); window.addEventListener('resize',resize);

  var pts=[];
  for(var i=0;i<14;i++) pts.push({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.4+0.5,
    vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,
    a:Math.random()*.5+.2,ph:Math.random()*6.28
  });

  var meteors=[];
  function spawnMeteor(){
    if(meteors.length>=3) return;
    meteors.push({
      x:Math.random()*W*1.5-W*0.2,y:-10,
      vx:W*(Math.random()*.016+.010),
      vy:H*(Math.random()*.024+.016),
      len:Math.random()*70+40,alpha:1,
      w:Math.random()*1.4+0.5,
      red:Math.random()>.3
    });
  }
  (function schedule(){
    setTimeout(function(){ spawnMeteor(); schedule(); },Math.random()*2500+1800);
  })();

  var last=0;
  function draw(t){
    requestAnimationFrame(draw);
    if(t-last<33) return;      // ~30 FPS
    last=t;
    ctx.clearRect(0,0,W,H);

    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      p.x+=p.vx;p.y+=p.vy;p.ph+=.03;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);
      ctx.fillStyle='rgba(255,20,20,'+(p.a*(.4+.6*Math.abs(Math.sin(p.ph))))+')';
      ctx.fill();
    }

    meteors=meteors.filter(function(m){
      var ang=Math.atan2(m.vy,m.vx), dx=Math.cos(ang)*m.len, dy=Math.sin(ang)*m.len;
      var col=m.red?'255,0,20':'255,120,100';
      var g=ctx.createLinearGradient(m.x-dx,m.y-dy,m.x,m.y);
      g.addColorStop(0,'rgba('+col+',0)');
      g.addColorStop(1,'rgba('+col+','+m.alpha+')');
      ctx.beginPath();ctx.moveTo(m.x-dx,m.y-dy);ctx.lineTo(m.x,m.y);
      ctx.strokeStyle=g;ctx.lineWidth=m.w;ctx.lineCap='round';ctx.stroke();
      m.x+=m.vx*2;m.y+=m.vy*2;m.alpha-=.024;   // x2 karena frame 30 FPS
      return m.alpha>0&&m.y<H+20&&m.x<W+50;
    });
  }
  requestAnimationFrame(draw);
})();

// Dipanggil dari Java (kompatibilitas) — tidak dipakai lagi
window.startSleepCountdown = function() {};
</script>
</body>
</html>
